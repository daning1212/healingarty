<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="PC에서 실행하는 오프라인 뮤직비디오 스토리보드 도구">
  <title>frame-storyboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111310;
      --panel: #191c18;
      --panel-2: #20241e;
      --line: #343a30;
      --text: #f2f2ec;
      --muted: #a3aa9b;
      --accent: #c3e35a;
      --danger: #ed8175;
      --radius: 12px;
      font-family: Inter, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .topbar {
      height: 68px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--line);
      background: #141612; position: sticky; top: 0; z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 170px; }
    .brand-mark { width: 28px; height: 28px; border: 2px solid var(--accent); position: relative; }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: var(--accent); }
    .brand-mark::before { width: 2px; height: 18px; left: 11px; top: 3px; transform: rotate(38deg); }
    .brand-mark::after { height: 2px; width: 18px; left: 3px; top: 12px; transform: rotate(-22deg); }
    .brand strong { font-size: 15px; letter-spacing: .02em; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .button {
      border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px;
      padding: 9px 12px; min-height: 38px; cursor: pointer; font-size: 13px;
    }
    .button:hover { border-color: #727d65; background: #292e26; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #171a12; font-weight: 750; }
    .button.primary:hover { background: #d2ef76; }
    .button.danger { color: var(--danger); }
    .button.small { min-height: 30px; padding: 5px 9px; font-size: 12px; }
    .save-state { color: var(--muted); font-size: 12px; margin: 0 8px; white-space: nowrap; }
    .workspace { display: grid; grid-template-columns: 255px minmax(320px, 1fr) 326px; min-height: calc(100vh - 68px); }
    .sidebar, .inspector { background: var(--panel); min-width: 0; }
    .sidebar { border-right: 1px solid var(--line); padding: 20px 14px; }
    .inspector { border-left: 1px solid var(--line); padding: 20px 18px; }
    .project-fields { padding: 0 5px 18px; border-bottom: 1px solid var(--line); margin-bottom: 17px; }
    .label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; margin: 0 0 7px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; background: #111310; color: var(--text); border: 1px solid var(--line);
      border-radius: 7px; padding: 10px 11px; min-height: 40px;
    }
    textarea { resize: vertical; min-height: 82px; line-height: 1.5; }
    .project-fields input { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 11px; }
    .section-title h2 { font-size: 13px; margin: 0; }
    .scene-list { display: grid; gap: 6px; }
    .scene-item {
      border: 1px solid transparent; background: transparent; border-radius: 8px;
      width: 100%; padding: 10px; text-align: left; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; gap: 8px;
    }
    .scene-item:hover { background: var(--panel-2); }
    .scene-item.active { background: #2a3022; border-color: #596644; }
    .scene-label { min-width: 0; }
    .scene-label strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
    .scene-label small { color: var(--muted); font-size: 11px; display: block; margin-top: 4px; }
    .scene-count { color: var(--muted); font-size: 11px; }
    .sidebar-note { color: var(--muted); font-size: 11px; line-height: 1.55; padding: 16px 5px 0; }
    .board-area { min-width: 0; padding: 28px clamp(18px, 3vw, 42px) 48px; }
    .board-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
    .eyebrow { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .15em; margin: 0 0 8px; }
    .board-header h1 { font-size: clamp(23px, 3vw, 34px); letter-spacing: -.035em; margin: 0; }
    .board-header p { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
    .board-actions { display: flex; gap: 7px; flex-shrink: 0; }
    .shot-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; align-items: start; }
    .shot-card {
      min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
      overflow: hidden; transition: border-color .15s, transform .15s; cursor: pointer;
    }
    .shot-card:hover { border-color: #69765c; transform: translateY(-2px); }
    .shot-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px #c3e35a33; }
    .shot-image { aspect-ratio: 16 / 9; background: #252a22; display: grid; place-items: center; overflow: hidden; position: relative; }
    .shot-image img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .image-empty { color: #818a78; font-size: 12px; text-align: center; padding: 12px; }
    .image-empty b { display: block; font-size: 25px; font-weight: 400; color: #a9b39b; margin-bottom: 5px; }
    .shot-number { position: absolute; top: 9px; left: 9px; border-radius: 5px; background: #111310dd; padding: 5px 7px; font-size: 11px; }
    .shot-card-body { padding: 13px; }
    .shot-card-title { font-size: 14px; margin: 0 0 6px; overflow-wrap: anywhere; }
    .shot-card-action { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 0; min-height: 34px; white-space: pre-wrap; }
    .shot-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; color: var(--muted); font-size: 11px; }
    .shot-controls { display: flex; gap: 5px; }
    .icon-button { border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 5px; padding: 4px 6px; }
    .icon-button:hover { background: #32382d; color: var(--text); }
    .empty-board { grid-column: 1 / -1; min-height: 260px; display: grid; place-items: center; text-align: center; border: 1px dashed #596052; border-radius: var(--radius); color: var(--muted); padding: 30px; }
    .empty-board h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
    .inspector-heading { font-size: 14px; margin: 0 0 18px; }
    .image-preview { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #111310; aspect-ratio: 16 / 9; margin-bottom: 9px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .image-preview img { width: 100%; height: 100%; object-fit: contain; }
    .image-actions { display: flex; gap: 7px; margin-bottom: 20px; }
    .field { margin-bottom: 15px; }
    .field textarea.prompt { min-height: 116px; }
    .two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 18px 0 0; }
    .disabled { opacity: .45; pointer-events: none; }
    #importFile, #imageFile { display: none; }
    #printArea { display: none; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #eaf4d0; color: #15180f; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 28px #0008; z-index: 20; font-size: 13px; }
    @media (max-width: 1080px) { .workspace { grid-template-columns: 220px minmax(300px, 1fr); } .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } .inspector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; } .inspector-heading { grid-column: 1 / -1; } }
    @media (max-width: 680px) {
      .topbar { height: auto; min-height: 64px; align-items: flex-start; flex-direction: column; padding: 13px 15px; gap: 10px; position: static; }
      .brand { min-width: 0; } .toolbar { justify-content: flex-start; }
      .save-state { margin-left: 0; }
      .workspace { display: flex; flex-direction: column; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; }
      .scene-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .sidebar-note { padding-top: 8px; }
      .board-area { padding: 22px 14px 32px; }
      .board-header { align-items: flex-start; flex-direction: column; }
      .inspector { border-left: 0; padding: 18px 14px; }
      .inspector-grid { grid-template-columns: 1fr; }
      .inspector-heading { grid-column: auto; }
    }
    @media print {
      body { color: #111; background: #fff; }
      .topbar, .workspace { display: none !important; }
      #printArea { display: block !important; padding: 10mm; color: #111; }
      #printArea h1 { font-size: 24px; margin: 0 0 3mm; }
      #printArea .print-meta { color: #444; margin-bottom: 8mm; font-size: 10pt; }
      #printArea h2 { font-size: 16px; margin: 8mm 0 3mm; border-bottom: 1px solid #aaa; padding-bottom: 2mm; }
      #printArea .print-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5mm; }
      #printArea .print-shot { border: 1px solid #bbb; padding: 3mm; break-inside: avoid; }
      #printArea img { width: 100%; max-height: 70mm; object-fit: contain; background: #eee; }
      #printArea h3 { font-size: 11pt; margin: 2mm 0; }
      #printArea p { font-size: 9pt; white-space: pre-wrap; margin: 1.5mm 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>frame-storyboard</strong><small>LOCAL STORYBOARD TOOL</small></div></div>
    <div class="toolbar">
      <span id="saveState" class="save-state" role="status">이 브라우저에 저장</span>
      <button id="newProject" class="button" type="button">새 프로젝트</button>
      <button id="importProject" class="button" type="button">프로젝트 열기</button>
      <button id="exportProject" class="button" type="button">ZIP으로 저장</button>
      <button id="exportJpg" class="button" type="button">현재 장면 JPG</button>
      <button id="printProject" class="button primary" type="button">인쇄 · PDF</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="프로젝트와 장면">
      <div class="project-fields">
        <label class="label" for="projectTitle">프로젝트</label>
        <input id="projectTitle" type="text" maxlength="120" placeholder="프로젝트 이름">
        <label class="label" for="aspectRatio">화면 비율</label>
        <select id="aspectRatio">
          <option value="16:9">16:9 가로</option>
          <option value="9:16">9:16 세로</option>
          <option value="1:1">1:1 정사각</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
      <div class="section-title"><h2>장면 보드</h2><button id="addScene" class="button small" type="button">＋ 장면</button></div>
      <div id="sceneList" class="scene-list"></div>
      <p class="sidebar-note">작업 내용은 이 브라우저에 자동 저장됩니다. 다른 PC로 옮기거나 백업할 때는 ZIP으로 저장하세요.</p>
    </aside>

    <main class="board-area">
      <div class="board-header">
        <div><p class="eyebrow">STORYBOARD / <span id="sceneNumber">01</span></p><h1 id="sceneHeading">장면 1</h1><p id="shotCount">컷 0개</p></div>
        <div class="board-actions">
          <button id="renameScene" class="button" type="button">장면 이름</button>
          <button id="deleteScene" class="button danger" type="button">장면 삭제</button>
          <button id="addShot" class="button primary" type="button">＋ 컷 추가</button>
        </div>
      </div>
      <section id="shotBoard" class="shot-board" aria-label="선택한 장면의 컷"></section>
    </main>

    <aside class="inspector" aria-label="선택한 컷 편집">
      <h2 class="inspector-heading">컷 정보</h2>
      <div id="inspectorContents">
        <div class="image-preview" id="imagePreview">컷을 선택하세요</div>
        <div class="image-actions">
          <button id="addImage" class="button small" type="button">사진 넣기</button>
          <button id="removeImage" class="button small" type="button">사진 빼기</button>
          <input id="imageFile" type="file" accept="image/*">
        </div>
        <div class="field"><label class="label" for="shotTitle">컷 제목</label><input id="shotTitle" data-field="title" maxlength="120" type="text"></div>
        <div class="field"><label class="label" for="action">화면에서 일어나는 일</label><textarea id="action" data-field="action" placeholder="인물의 행동과 화면 변화를 적어주세요."></textarea></div>
        <div class="two-fields">
          <div class="field"><label class="label" for="shotSize">샷 크기</label><select id="shotSize" data-field="shotSize"><option>와이드</option><option>풀샷</option><option>미디엄</option><option>클로즈업</option><option>디테일</option><option>기타</option></select></div>
          <div class="field"><label class="label" for="duration">길이 (초)</label><input id="duration" data-field="duration" type="number" min="0.5" max="600" step="0.5"></div>
        </div>
        <div class="field"><label class="label" for="camera">카메라 · 움직임</label><input id="camera" data-field="camera" type="text" placeholder="예: 고정, 천천히 앞으로 이동"></div>
        <div class="field"><label class="label" for="sound">대사 · 소리 · 음악</label><textarea id="sound" data-field="sound" placeholder="대사, 효과음, 배경음악"></textarea></div>
        <div class="field"><label class="label" for="prompt">영상 프롬프트</label><textarea id="prompt" class="prompt" data-field="prompt" placeholder="필요하면 생성형 영상 프롬프트를 적어두세요."></textarea></div>
        <div class="field"><label class="label" for="notes">메모</label><textarea id="notes" data-field="notes" placeholder="전환, 소품, 연기 지시 등"></textarea></div>
      </div>
      <p class="hint">사진은 컷에 연결해 브라우저에 보관합니다. ZIP으로 저장하면 프로젝트 정보와 원본 사진이 한 파일로 묶입니다.</p>
    </aside>
  </div>

  <section id="printArea" aria-hidden="true"></section>
  <input id="importFile" type="file" accept=".zip,.frame.zip,.json,application/zip,application/json">

  <script>
    "use strict";
    const STORAGE_KEY = "frame-storyboard-project-v1";
    const DB_NAME = "frame-storyboard-assets-v1";
    let project = loadProject();
    let selectedSceneId = project.scenes[0]?.id || null;
    let selectedShotId = project.scenes[0]?.shots[0]?.id || null;
    let dbPromise;
    let objectUrls = new Map();
    let saveTimer;

    function uid() { return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }
    function blankShot() {
      return { id: uid(), title: "새 컷", duration: 5, shotSize: "미디엄", action: "", camera: "", sound: "", prompt: "", notes: "", assetId: null, assetName: "" };
    }
    function blankScene(number) { return { id: uid(), title: "장면 " + number, shots: [blankShot()] }; }
    function blankProject() { return { id: uid(), title: "새 스토리보드", aspectRatio: "16:9", updatedAt: new Date().toISOString(), scenes: [blankScene(1)] }; }
    function hasBrokenText(value) {
      return typeof value === "string" && (value.indexOf("\uFFFD") !== -1 || value.indexOf("ï¿½") !== -1);
    }
    function repairSavedProject(saved) {
      if (hasBrokenText(saved.title)) saved.title = "새 스토리보드";
      if (hasBrokenText(saved.aspectRatio)) saved.aspectRatio = "16:9";
      saved.scenes.forEach(function (scene, sceneIndex) {
        if (!scene || typeof scene !== "object") return;
        if (hasBrokenText(scene.title)) scene.title = "장면 " + (sceneIndex + 1);
        if (!Array.isArray(scene.shots)) return;
        scene.shots.forEach(function (shot, shotIndex) {
          if (!shot || typeof shot !== "object") return;
          if (hasBrokenText(shot.title)) shot.title = "새 컷 " + (shotIndex + 1);
          if (hasBrokenText(shot.shotSize)) shot.shotSize = "미디엄";
          ["action", "camera", "sound", "prompt", "notes"].forEach(function (field) {
            if (hasBrokenText(shot[field])) shot[field] = "";
          });
          if (hasBrokenText(shot.assetName)) shot.assetName = "";
        });
      });
      return saved;
    }
    function loadProject() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (saved && Array.isArray(saved.scenes)) return repairSavedProject(saved);
      } catch (_) {}
      return blankProject();
    }
    function currentScene() { return project.scenes.find(function (scene) { return scene.id === selectedSceneId; }) || null; }
    function currentShot() {
      const scene = currentScene();
      return scene ? scene.shots.find(function (shot) { return shot.id === selectedShotId; }) || null : null;
    }
    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
      });
    }
    function openDB() {
      if (!("indexedDB" in window)) return Promise.reject(new Error("IndexedDB unavailable"));
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function (resolve, reject) {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function () { request.result.createObjectStore("images"); };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error || new Error("Could not open local image storage")); };
      });
      return dbPromise;
    }
    async function putAsset(id, blob) {
      const db = await openDB();
      return new Promise(function (resolve, reject) {
        const tx = db.transaction("images", "readwrite");
        tx.objectStore("images").put(blob, id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error || new Error("Could not save image")); };
      });
    }
    async function getAsset(id) {
      if (!id) return null;
      const db = await openDB();
      return new Promise(function (resolve, reject) {
        const request = db.transaction("images", "readonly").objectStore("images").get(id);
        request.onsuccess = function () { resolve(request.result || null); };
        request.onerror = function () { reject(request.error || new Error("Could not read image")); };
      });
    }
    async function deleteAsset(id) {
      if (!id) return;
      const url = objectUrls.get(id);
      if (url) { URL.revokeObjectURL(url); objectUrls.delete(id); }
      const db = await openDB();
      return new Promise(function (resolve, reject) {
        const tx = db.transaction("images", "readwrite");
        tx.objectStore("images").delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error || new Error("Could not remove image")); };
      });
    }
    async function assetUrl(id) {
      if (!id) return "";
      if (objectUrls.has(id)) return objectUrls.get(id);
      const blob = await getAsset(id);
      if (!blob) return "";
      const url = URL.createObjectURL(blob);
      objectUrls.set(id, url);
      return url;
    }
    function scheduleSave() {
      document.getElementById("saveState").textContent = "저장 중…";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        try {
          project.updatedAt = new Date().toISOString();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
          document.getElementById("saveState").textContent = "이 브라우저에 저장됨";
        } catch (_) {
          document.getElementById("saveState").textContent = "저장 공간 부족 · ZIP으로 저장";
        }
      }, 250);
    }
    function updateShotCardText(shot) {
      const card = document.querySelector('[data-shot-id="' + shot.id + '"]');
      if (!card) return;
      card.querySelector(".shot-card-title").textContent = shot.title || "제목 없는 컷";
      card.querySelector(".shot-card-action").textContent = shot.action || "화면 설명을 입력하세요.";
      card.querySelector(".shot-seconds").textContent = (shot.duration || 0) + "초";
    }
    function renderSceneList() {
      const root = document.getElementById("sceneList");
      root.innerHTML = "";
      project.scenes.forEach(function (scene, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "scene-item" + (scene.id === selectedSceneId ? " active" : "");
        button.dataset.sceneId = scene.id;
        button.innerHTML = '<span class="scene-label"><strong>' + escapeHtml(scene.title) + '</strong><small>장면 ' + String(index + 1).padStart(2, "0") + '</small></span><span class="scene-count">' + scene.shots.length + '컷</span>';
        root.appendChild(button);
      });
    }
    async function renderBoard() {
      const scene = currentScene();
      const root = document.getElementById("shotBoard");
      root.innerHTML = "";
      document.getElementById("sceneHeading").textContent = scene ? scene.title : "장면 없음";
      document.getElementById("sceneNumber").textContent = String(Math.max(0, project.scenes.indexOf(scene) + 1)).padStart(2, "0");
      document.getElementById("shotCount").textContent = scene ? "컷 " + scene.shots.length + "개" : "왼쪽에서 장면을 추가하세요.";
      document.getElementById("addShot").disabled = !scene;

        const title = window.prompt("장면 이름", scene.title);
        if (title == null) return;
        scene.title = title.trim() || scene.title;
        scheduleSave(); renderAll();
      });
      document.getElementById("addImage").addEventListener("click", function () { if (currentShot()) document.getElementById("imageFile").click(); });
      document.getElementById("imageFile").addEventListener("change", async function (event) {
        const file = event.target.files && event.target.files[0];
        const shot = currentShot();
        if (!file || !shot) return;
        if (!file.type.startsWith("image/")) { alert("이미지 파일을 선택해 주세요."); event.target.value = ""; return; }
        try {
          if (shot.assetId) await deleteAsset(shot.assetId);
          const id = uid();
          await putAsset(id, file);
          shot.assetId = id; shot.assetName = file.name;
          scheduleSave(); await renderAll(); toast("사진을 컷에 넣었습니다.");
        } catch (error) {
          alert("사진을 저장하지 못했습니다. 브라우저의 로컬 저장 공간을 확인해 주세요.");
        }
        event.target.value = "";
      });
      document.getElementById("removeImage").addEventListener("click", async function () {
        const shot = currentShot();
        if (!shot || !shot.assetId || !window.confirm("이 컷에서 사진을 빼고 브라우저 저장소에서도 삭제할까요?")) return;
        await deleteAsset(shot.assetId); shot.assetId = null; shot.assetName = "";
        scheduleSave(); await renderAll(); toast("사진을 제거했습니다.");
      });
      document.getElementById("newProject").addEventListener("click", function () {
        if (!window.confirm("현재 프로젝트를 새 프로젝트로 바꿀까요? 사진이 포함된 ZIP으로 먼저 저장할 수 있습니다.")) return;
        project = blankProject(); selectedSceneId = project.scenes[0].id; selectedShotId = project.scenes[0].shots[0].id;
        scheduleSave(); renderAll();
      });
      document.getElementById("exportProject").addEventListener("click", function () { exportProject().catch(function (error) { alert("프로젝트 ZIP을 만들지 못했습니다: " + error.message); }); });
      document.getElementById("exportJpg").addEventListener("click", function () { exportSceneJpg().catch(function (error) { alert("JPG를 만들지 못했습니다: " + error.message); }); });
      document.getElementById("importProject").addEventListener("click", function () { document.getElementById("importFile").click(); });
      document.getElementById("importFile").addEventListener("change", function (event) {
        const file = event.target.files && event.target.files[0];
        if (file) importProject(file).catch(function (error) { alert("프로젝트를 열지 못했습니다: " + error.message); });
        event.target.value = "";
      });
      document.getElementById("printProject").addEventListener("click", function () { printProject().catch(function () { alert("인쇄용 보드를 준비하지 못했습니다."); }); });
    }
    bindEvents();
    renderAll();
    scheduleSave();
  </script>
</body>
</html>
