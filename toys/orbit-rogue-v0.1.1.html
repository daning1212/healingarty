<title>ORBIT ROGUE v0.1.1 · 슈팅 로그라이크</title>
<style>

nt-size:11px}.box{padding:12px}}

<style>
:root{--ink:#edf8ff;--muted:#a2bbd4;--accent:#66e3ff;--line:#28445c;--gold:#ffd483;--surface:#0d192a}
body{background:radial-gradient(ellipse at 50% -30%,#173958 0%,#0b1526 43%,#070c17 77%);color:var(--ink)}
main{width:min(1080px,100%);padding:clamp(9px,2.4vw,24px)}
header{margin-bottom:13px}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:29px;height:29px;display:grid;place-items:center;border:1px solid #67d9ed;border-radius:7px;color:var(--accent);box-shadow:inset 0 0 15px #67d9ed24}
.brand strong{font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:.08em}
.hud{display:grid;grid-template-columns:auto auto repeat(3,minmax(70px,1fr)) auto auto;gap:10px 17px;background:#0a1728;border-color:#2f546e;border-radius:7px;padding:8px 12px;min-height:42px}
.hud span{white-space:nowrap}.hud strong{display:block;color:var(--ink);font-size:13px;line-height:1.2}
.hud small{display:block;color:var(--muted);font-size:10px;letter-spacing:.035em}
.hud meter{width:100%;height:8px;display:block;accent-color:var(--accent)}
.hud meter::-webkit-meter-bar{background:#21334a;border:0;border-radius:3px}
.hud meter::-webkit-meter-optimum-value{background:var(--meter,var(--accent));border-radius:3px}
.hud meter::-moz-meter-bar{background:var(--meter,var(--accent));border-radius:3px}
.hud .credits strong{color:var(--gold)}
.field{border-color:#2a526d;box-shadow:0 16px 40px #0006}
.panel{background:#050b18bd}
.box{max-width:100%;background:linear-gradient(145deg,#122539fa,#0b1525fa 72%);box-shadow:0 18px 65px #0008;border-color:#48687e}
.box h2{font-size:clamp(21px,3.5vw,34px);line-height:1.13}
.panel[data-screen="level"] .grid{grid-template-columns:1fr;margin:0}
.panel[data-screen="level"] .split{grid-template-columns:minmax(160px,1fr) minmax(210px,1.6fr);margin:16px 0}
.panel[data-screen="level"] .card{min-height:67px}
.panel[data-screen="level"] .stat,.panel[data-screen="shop"] .stat,.panel[data-screen="result"] .stat{display:grid;gap:3px}
.card{background:linear-gradient(120deg,#182e45,#111f32);border-color:#395f7f;position:relative}
.card strong{font-size:15px}
.card span{line-height:1.4}
.card .choice{font-size:10px;letter-spacing:.06em;color:#a9c1d8}
.card[data-kind="copy"]{border-left:4px solid #b295ff}
.card[data-kind="stat"]{border-left:4px solid #74d7fa}
.card[data-kind="support"]{border-left:4px solid #74dfba}
.card[data-rank="4"] span{color:var(--gold)}
.card:hover:not(:disabled),.card:focus-visible{background:linear-gradient(120deg,#214769,#172b41)}
button.primary{background:linear-gradient(120deg,#0c4157,#0a3045);border-color:#5edaff;box-shadow:inset 0 0 12px #44ceff21}
.hangar-grid{display:grid;grid-template-columns:1fr 1.45fr;gap:16px;align-items:center}
.hangar-preview{width:100%;height:auto;min-height:0;aspect-ratio:5/4;background:radial-gradient(ellipse at center,#194a71,#102236 60%,#0b1525);border:1px solid #365671;border-radius:8px;touch-action:auto}
.hangar-grid .grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:8px 0}
.hangar-grid .card{min-height:63px}
.hangar-grid .card[aria-pressed="true"]{border-color:var(--accent);background:#173b52}
.stage-route{display:flex;align-items:center;gap:7px;margin:12px 0;color:var(--muted);font-size:12px}
.stage-route i{height:1px;flex:1;background:linear-gradient(90deg,#446585,var(--accent))}
.stage-route strong{color:var(--gold)}
summary{cursor:pointer;color:var(--accent);font-size:12px;margin-top:8px}
.options input{width:100%;accent-color:var(--accent)}
@media(max-width:680px){.hud{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:7px}.hud strong{font-size:11px}.hud small{font-size:9px}}
@media(max-width:540px){.hangar-grid,.panel[data-screen="level"] .split{grid-template-columns:1fr}.hangar-preview{max-height:116px}.panel[data-screen="level"] .split{gap:10px}.panel[data-screen="level"] .card{min-height:0}.box h2{font-size:21px}.buttons button{font-size:13px}}
.header-controls{display:flex;align-items:center;gap:6px}
.header-controls button{padding:6px 9px;font-size:12px}
.joystick{position:absolute;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,25px);z-index:1;width:clamp(80px,24vw,112px);aspect-ratio:1;border-radius:50%;background:#080a0de8;border:1px solid #748194;box-shadow:0 4px 18px #0009;touch-action:none;user-select:none}
.joystick[hidden]{display:none}
.joystick::before,.joystick::after{content:"";position:absolute;background:#3a414a;pointer-events:none}
.joystick::before{left:12%;right:12%;top:50%;height:1px}
.joystick::after{top:12%;bottom:12%;left:50%;width:1px}
.joystick-knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:#121418;border:1px solid #9ea9b5;box-shadow:inset 0 0 8px #ffffff18;transform:translate(calc(-50% + var(--stick-x,0px)),calc(-50% + var(--stick-y,0px)));pointer-events:none;z-index:1}
.panel{z-index:2}
@media(max-width:680px),(pointer:coarse) and (max-height:780px){
  html,body{margin:0;overscroll-behavior:none}
  main{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:7px 8px max(7px,env(safe-area-inset-bottom))}
  header{flex:none;margin-bottom:6px;gap:5px}
  .brand{gap:5px}.brand-mark{width:21px;height:21px}.brand strong{font-size:15px}
  .header-controls button{font-size:10px;padding:5px 6px}
  .hud{flex:none;margin-bottom:5px;padding:5px 6px;min-height:0}
  .field{flex:1;min-height:0;box-shadow:none}
  #canvas{position:absolute;inset:0;width:100%;height:100%;min-height:0}
  .panel{padding:5px}
  .box{max-height:100%;overscroll-behavior:contain}
  footer{flex:none;margin-top:5px;font-size:10px;line-height:1.25}
}
@media(pointer:coarse){.desktop-help{display:none}}
@media(pointer:fine){.touch-help{display:none}}
</style>

function loadArtwork(){
  if(typeof Image==='undefined')return;
  for(const {data,cutouts} of sheets){
    const source=new Image();
    source.onload=()=>{
      for(const [name,x,y,w,h,mask] of cutouts){
        const sprite=document.createElement('canvas');
        sprite.width=w;sprite.height=h;
        const draw=sprite.getContext('2d');
        if(mask){
          draw.beginPath();
          mask.forEach(([px,py],i)=>i?draw.lineTo(px*w,py*h):draw.moveTo(px*w,py*h));
          draw.closePath();draw.clip();
        }
        draw.drawImage(source,x/2,y/2,w/2,h/2,0,0,w,h);
        const pixels=draw.getImageData(0,0,w,h), p=pixels.data;
        for(let i=0;i<p.length;i+=4){
          const signal=Math.max(p[i]-12,p[i+1]-22,p[i+2]-41);
          p[i+3]=Math.round(p[i+3]*Math.min(1,Math.max(0,signal/21)));
        }
        draw.putImageData(pixels,0,0);
        artwork[name]=sprite;
      }
    };
    source.src=data;
  }
}
function drawArt(name,x,y,width,height){
  const image=artwork[name];
  if(!image)return false;
  const scale=Math.min(width/image.width,height/image.height);
  const w=image.width*scale,h=image.height*scale;
  ctx.drawImage(image,x-w/2,y-h/2,w,h);
  return true;
}

function sound(freq,duration,gain=1,music=false,wave=music?'sine':'triangle',endFrequency=freq){
  const volume=(music?prefs.music:prefs.fx)/100;
  if(!audio||!volume||audio.state!=='running')return;
  const osc=audio.createOscillator(), amp=audio.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,audio.currentTime);
  if(endFrequency!==freq)osc.frequency.exponentialRampToValueAtTime(endFrequency,audio.currentTime+duration);
  amp.gain.setValueAtTime(.045*gain*volume,audio.currentTime);
  amp.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);
  osc.connect(amp);amp.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);
}
function playMusic(now){
  if(!['combat','boss'].includes(mode)||!audio||audio.state!=='running'||!prefs.music)return;
  if(musicPhase!==mode){musicPhase=mode;musicStep=0;musicAt=now;}
  if(now<musicAt)return;
  const sixteenth=60000/(mode==='boss'?166:154)/4;
  musicAt=now-musicAt>sixteenth?now+sixteenth:musicAt+sixteenth;
  const beat=musicStep%16, bar=Math.floor(musicStep/16)%4;
  const root=(mode==='boss'?[49,58.27,43.65,46.25]:[55,65.41,48.99,49])[bar];
  if(beat%4===0)sound(112,.095,2.4,true,'sine',42);
  if(beat%4===2)sound(1950,.032,.42,true,'square',700);
  if(beat===4||beat===12)sound(325,.061,.73,true,'triangle',120);
  if(beat%2===0)sound(root,.093,1.48,true,'triangle');
  const intervals=mode==='boss'?[0,7,12,15,12,7,6,12]:[0,7,12,15,12,7,19,15];
  const semitones=intervals[musicStep%intervals.length];
  sound(root*4*2**(semitones/12),.087,beat%4===0?.66:.39,true,'triangle');
  musicStep++;
}

function fitArena(){

  const width=mobileArena?.matches?clamp(Math.round(H*rect.width/rect.height),320,960):960;
  if(width===W)return;
  const ratio=width/W;W=width;canvas.width=width;
  if(!world)return;
  world.x=clamp(world.x*ratio,16,W-16);
  for(const group of [world.targets,world.shots,world.hostile,world.gems,world.drops,world.sparks,world.blasts]){
    for(const entity of group)entity.x*=ratio;
  }

function nearest(x,y,limit=Infinity){
  let best=null, distance=limit;
  for(const t of world.targets){
    if(t.hp<=0)continue;
    const d=Math.hypot(t.x-x,t.y-y);
    if(d<distance){best=t;distance=d;}
  }
  return best;
}

function fire(){

    const tx=id===3&&target?target.x:x, ty=id===3&&target?target.y:0;
    world.beams.push({x,y,tx,ty,life:.13});
    const dx=tx-x,dy=ty-y, len=Math.max(1,dx*dx+dy*dy);

}
const dropSymbols={magnet:'M',purge:'✦',sale:'½',free:'R',halfRoll:'r½',half:'½×',dice:'⚄',loyalty:'10%'};
const dropNames={magnet:'광석 자석',purge:'전멸 펄스',sale:'이번 판 장비 반값',free:'리롤 무료 1회',halfRoll:'리롤 반값 1회',half:'상품 반값 1개',dice:'행운의 주사위',loyalty:'단골 영구 할인'};
function step(dt){
  if(mode==='boss-clear'){
    animateExplosions(dt);
    world.clearDelay-=dt;
    if(world.clearDelay<=0){
      if(run.stage===20)end(true);
      else openShop();
    }
    return;
  }
  const combat=mode==='combat';
  if(!combat&&mode!=='boss')return;
  animateExplosions(dt);
  world.inv=Math.max(0,world.inv-dt);world.flash=Math.max(0,world.flash-dt);world.magnet-=dt;
  world.shieldDelay-=dt;
  if(world.shieldDelay<=0)run.shield=Math.min(run.shieldMax,run.shield+7*dt);
  run.hp=Math.min(run.max,run.hp+run.regen*dt);
  let dx=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA'));
  let dy=Number(keys.has('ArrowDown')||keys.has('KeyS'))-Number(keys.has('ArrowUp')||keys.has('KeyW'));
  if(pointer){dx=clamp((pointer.x-world.x)/22,-1,1);dy=clamp((pointer.y-world.y)/22,-1,1);}
  if(stick.id!==null){dx=stick.x;dy=stick.y;}
  const scale=Math.max(1,Math.hypot(dx,dy));
  world.x=clamp(world.x+dx/scale*run.speed*dt,16,W-16);world.y=clamp(world.y+dy/scale*run.speed*dt,16,H-16);
  if(combat){
    run.time=Math.max(0,run.time-dt);world.spawn-=dt;
    if(run.time===0){
      if(run.stage===10||run.stage===20)startBoss();
      else{openShop();return;}
    }else if(world.spawn<=0){world.spawn=spawnWave(wavePressure(run.time));}
  }
  if(mode==='boss')bossStep(dt);
  world.fire-=dt;if(world.fire<=0)world.fire=fire()/(1+run.rate);
  world.drone-=dt;
  if(world.drone<=0&&(run.support[1]||run.support[2])){
    const satellite=run.support[1], drone=run.support[2];
    const t=nearest(world.x,world.y);
    if(t){
      for(const [n,side] of [[satellite,-1],[drone,1]]){
        if(!n)continue;
        const x=world.x+side*30;
        projectile(x,world.y-10,Math.atan2(t.y-world.y,t.x-x),510,6+n*6+run.engineering,'support',true);
      }
    }
    world.drone=.68;
  }
  for(const t of world.targets){
    if(t.boss||t.hp<=0)continue;
    t.y+=t.vy*dt;t.seed+=dt;
    if(!t.rock){
      t.x=clamp(t.x+Math.sin(t.seed*1.8)*40*dt,24,W-24);t.fire-=dt;
      if(t.fire<0&&t.y>18&&t.y<H-150){
        const aim=Math.atan2(world.y-t.y,world.x-t.x), speed=116+run.stage*7;
        for(const offset of t.variant==='fanfire'?[-.27,0,.27]:[0])hostile(t,aim+offset,speed);
        t.fire=rng(2.4,5.3);
      }
    }
    if(near(t,world,t.r+12)){hurt(t.rock?18:15);if(!t.rock)t.hp=0;}
  }
  for(const s of world.shots){
    if(s.seek){
      const t=nearest(s.x,s.y,330);
      if(t){
        const speed=Math.hypot(s.vx,s.vy),angle=Math.atan2(t.y-s.y,t.x-s.x);
        s.vx+=(Math.cos(angle)*speed-s.vx)*Math.min(1,dt*7);
        s.vy+=(Math.sin(angle)*speed-s.vy)*Math.min(1,dt*7);
      }
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    const hit=world.targets.find(t=>t.hp>0&&near(t,s,t.r+5));
    if(hit){
      hit.hp-=s.power;s.life=0;
      if(s.kind==='missile'&&run.rank>=2)
        for(const t of world.targets)if(t!==hit&&near(t,hit,(32+run.rank*4)*(1+run.area)))t.hp-=s.power*.55;
    }
  }
  world.shots=world.shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-35&&s.y<H+35);
  world.hostile=world.hostile.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(near(p,world,13)){hurt(11+run.stage*.5);return false;}
    return p.x>-25&&p.x<W+25&&p.y>-25&&p.y<H+25;
  });
  world.zones=world.zones.filter(z=>{
    z.age+=dt;
    if(z.age>=z.warning&&!z.done){
      z.done=true;
      if(world.x>z.x&&world.x<z.x+z.w&&world.y>z.y&&world.y<z.y+z.h)hurt(run.stage===10?32:44);
    }
    return z.age<z.warning+.33;
  });
  world.beams=world.beams.filter(b=>(b.life-=dt)>0);
  if(run.hp<=0){end(false);return;}
  let defeated=false;
  world.targets=world.targets.filter(t=>{
    if(t.hp>0)return t.y<H+60;
    explode(t);
    run.score+=t.boss?2500:t.rock?25:70;run.kills+=t.rock?0:1;
    run.coin+=t.boss?55:t.rock?1:2;drop(t);
    defeated ||= !!t.boss;
    return false;
  });
  const radius=run.pickup+run.support[3]*40;
  world.gems=world.gems.filter(g=>{
    const d=Math.hypot(g.x-world.x,g.y-world.y);
    if(d<14){run.xp++;run.score+=4;sound(800,.035,.22);return false;}
    if(d<radius||world.magnet>0){
      const v=dt*(world.magnet>0?650:310)/Math.max(d,1);
      g.x+=(world.x-g.x)*Math.min(v,1);g.y+=(world.y-g.y)*Math.min(v,1);
    }
    return (g.life-=dt)>0;
  });
  world.drops=world.drops.filter(d=>{
    if(near(d,world,25)){collect(d.type);world.notice=dropNames[d.type];world.noticeFor=2.8;return false;}
    return (d.life-=dt)>0;
  });
  if(world.noticeFor>0)world.noticeFor-=dt;
  if(defeated){
    mode='boss-clear';
    resetStick();syncStick(false);
    world.clearDelay=.78;
    world.hostile=[];
    world.zones=[];
    return;
  }
  updateRank();
}
const stars=Array.from({length:112},()=>[rng(0,W),rng(0,H),rng(.2,1.5)]);
function path(points,fill,stroke){
  ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function ship(x,y,size,enemy=false,tier=0){
  if(drawArt(enemy?'raider':'player'+tier,x,y,63*size,79*size))return;
  ctx.save();ctx.translate(x,y);if(enemy)ctx.rotate(Math.PI);ctx.scale(size,size);
  const stroke=enemy?'#ff6f7e':tier>2?'#d4a9ff':'#86dbff';
  path([[-17,15],[-9,-1],[0,-28],[9,-1],[17,15],[6,11],[0,18],[-6,11]],enemy?'#913546':'#325a8d',stroke);
  path([[0,-23],[6,2],[0,10],[-6,2]],enemy?'#ff9b99':'#c7f0ff');
  path([[-6,14],[0,29],[6,14]],enemy?'#f54f79':tier>2?'#bf77ff':'#44dfff');
  if(tier>0){
    const wing=17+2*tier;
    path([[-wing,12],[-wing+5,-4],[-8,11]],'#5379a5',stroke);
    path([[wing,12],[wing-5,-4],[8,11]],'#5379a5',stroke);
  }
  ctx.restore();
}
function drawBoss(t){
  if(drawArt(run.stage===10?'boss10':'boss20',t.x,t.y,run.stage===10?185:230,run.stage===10?174:216))return;
  ctx.save();ctx.translate(t.x,t.y);
  const final=run.stage===20,color=final?'#cd8aff':'#ffaf57';
  for(let i=0;i<(final?6:2);i++){
    ctx.save();ctx.rotate(final?i*Math.PI/3:(i===0?-.38:.38));
    path(final?[[0,-102],[-27,-43],[-15,-14],[17,-14],[27,-43]]:[[-68,-30],[-17,-57],[12,4],[-12,64],[-73,44]],
      final?'#33265a':'#844125',color);
    ctx.restore();
  }
  ctx.shadowBlur=21;ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(0,0,final?36:27,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=final?'#0c0521':'#f1742e';ctx.fill();
  ctx.restore();
}
function paint(){
  ctx.fillStyle='#090f1d';ctx.fillRect(0,0,W,H);
  for(const [x,y,s] of stars){ctx.fillStyle=s>1.1?'#587ea7':'#233c58';ctx.fillRect(x,y,s,s);}
  if(!world||mode==='hangar'){
    const preview=$('hangarShip'), image=artwork.player0;
    if(preview&&image&&!preview.drawn){
      const surface=preview.getContext('2d');
      const height=196,width=height*image.width/image.height;
      surface.drawImage(image,(300-width)/2,22,width,height);
      preview.drawn=true;
    }
    return;
  }
  for(const z of world.zones){
    if(z.age<0)continue;
    const p=clamp(z.age/z.warning,0,1),c=run.stage===10?'255,139,61':'200,110,255';
    ctx.fillStyle='rgba('+c+','+(z.done?.76:.07+p*.36)+')';ctx.fillRect(z.x,z.y,z.w,z.h);
    ctx.strokeStyle='rgba('+c+','+(z.done||p>.88?1:.48)+')';ctx.lineWidth=p>.88?3:1;ctx.strokeRect(z.x,z.y,z.w,z.h);
  }
  for(const g of world.gems){
    if(!drawArt('ore'+g.ore,g.x,g.y,13,18))
      path([[g.x,g.y-5],[g.x+4,g.y],[g.x,g.y+5],[g.x-4,g.y]],'#57e6cc');
  }
  ctx.textAlign='center';ctx.font='bold 12px system-ui';
  for(const d of world.drops){
    ctx.fillStyle='#ffcd7b';ctx.fillRect(d.x-13,d.y-10,26,20);
    ctx.fillStyle='#1b1a2b';ctx.fillText(dropSymbols[d.type],d.x,d.y+4);
  }
  for(const t of world.targets){
    if(t.boss){drawBoss(t);continue;}
    if(!t.rock){
      if(!drawArt(t.variant,t.x,t.y,t.r*2.7,t.r*2.7))ship(t.x,t.y,.75,true);
      if(t.variant!=='raider'&&t.y>0&&t.y<H){
        const width=t.r*1.6, x=t.x-width/2,y=Math.max(5,t.y-t.r*1.4-7);
        ctx.fillStyle='#201a29';ctx.fillRect(x-1,y-1,width+2,6);
        ctx.fillStyle=t.variant==='warden'?'#a995ff':'#ffac71';
        ctx.fillRect(x,y,width*clamp(t.hp/t.max,0,1),4);
      }
      continue;
    }
    if(drawArt('rock'+t.variant,t.x,t.y,t.r*2.25,t.r*2.25))continue;
    const points=Array.from({length:8},(_,i)=>{
      const a=i*Math.PI/4+t.seed*.2,r=t.r*(.76+.22*Math.sin(i*7+2));
      return [t.x+Math.cos(a)*r,t.y+Math.sin(a)*r];
    });
    path(points,'#3c485e','#748496');
    path([[t.x-6,t.y],[t.x+2,t.y-10],[t.x+9,t.y],[t.x+2,t.y+9]],'#4aab9a');
  }
  for(const s of world.shots){
    ctx.fillStyle=s.kind==='missile'?'#ffd48f':s.kind==='support'?'#bcaaff':'#75e4ff';
    ctx.fillRect(s.x-2,s.y-8,4,s.kind==='missile'?14:10);
  }
  for(const p of world.hostile){
    ctx.fillStyle='#ff6179';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
  }
  for(const b of world.beams){
    ctx.strokeStyle='#8268ffd0';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.tx,b.ty);ctx.stroke();
    ctx.strokeStyle='#c7f9ff';ctx.lineWidth=3;ctx.stroke();
  }
  ctx.save();
  for(const b of world.blasts){
    const progress=1-b.life/b.duration;
    ctx.globalAlpha=(1-progress)*.8;
    ctx.strokeStyle=b.color;ctx.lineWidth=3*(1-progress)+1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*(.35+progress*1.8),0,Math.PI*2);ctx.stroke();
    if(progress<.24){
      ctx.fillStyle='#fff4d2';
      ctx.globalAlpha=(1-progress/.24)*.69;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*(.45+progress),0,Math.PI*2);ctx.fill();
    }
  }
  for(const p of world.sparks){
    ctx.globalAlpha=p.life/p.duration;
    ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.restore();
  if(run.support[0]||world.flash>0){
    if(run.support[0]&&world.flash<=0){
      ctx.globalAlpha=.62;
      drawArt('shield',world.x,world.y,62,62);
      ctx.globalAlpha=1;
    }
    ctx.strokeStyle=world.flash>0?'#c2faff':'#339abe8a';ctx.lineWidth=world.flash>0?4:1;
    ctx.beginPath();ctx.arc(world.x,world.y,world.flash>0?35+(1-world.flash/.42)*(90+run.support[0]*27)*(1+run.area):27,0,7);ctx.stroke();
  }
  if(run.support[1]||run.support[2]){
    const a=last/480;
    const sx=world.x+Math.cos(a)*41,sy=world.y+Math.sin(a)*24;
    const ix=world.x+Math.cos(a+Math.PI)*47,iy=world.y-19+Math.sin(a)*16;
    if(run.support[1]&&!drawArt('satellite',sx,sy,25,25))ship(sx,sy,.36);
    if(run.support[2]&&!drawArt('interceptor',ix,iy,27,27))ship(ix,iy,.32);
  }
  if(world.inv<=0||Math.floor(last/55)%2===0)ship(world.x,world.y,1,false,run.rank);
  if(boss&&boss.hp>0){
    const width=Math.min(500,W-42), x=(W-width)/2;
    ctx.fillStyle='#361f49';ctx.fillRect(x,18,width,8);
    ctx.fillStyle=run.stage===10?'#ffa066':'#d987ff';ctx.fillRect(x,18,width*boss.hp/boss.max,8);
    ctx.fillStyle='#fff';ctx.fillText(run.stage===10?'RIFT EXCAVATOR':'NULL CROWN',W/2,45);
  }
  if(world.noticeFor>0){
    ctx.fillStyle='#ffda92';ctx.fillText(world.notice,W/2,H-22);
  }
}
let lastHud='';
function setHud(markup){
  if(markup===lastHud)return;
  $('hud').innerHTML=markup;lastHud=markup;
}
function showHud(){
  if(!run||mode==='hangar'){setHud('<span><small>원정 경로</small><strong>01–20</strong></span><span><small>최고 점수</small><strong>'+best.toLocaleString()+'</strong></span>');return;}
  const seconds=Math.ceil(run.time), time=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
  const field=(label,value,style='')=>'<span class="'+style+'"><small>'+label+'</small><strong>'+value+'</strong></span>';
  const meter=(label,value,max,color)=>'<span><small>'+label+' '+value+'/'+max+'</small><meter min="0" max="'+max+
    '" value="'+clamp(value,0,max)+'" aria-label="'+label+'" style="--meter:'+color+'"></meter></span>';
  setHud(field('구역',run.stage+' / 20')+field(boss?'보스전':'공세 '+(wavePressure(run.time)+1)+'/5',boss?'BOSS':time)+
    meter('실드',Math.ceil(run.shield),run.shieldMax,'#64dfff')+
    meter('내구도',Math.max(0,Math.ceil(run.hp)),run.max,'#73e4ae')+
    meter('경험치 · Lv.'+run.level,run.xp,xpGoal(),'#b995ff')+
    field('코인',run.coin,'credits')+field('점수',run.score.toLocaleString()));
}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  step(dt);
  playMusic(now);
  paint();showHud();requestAnimationFrame(frame);
}
loadArtwork();hangar();fitArena();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitArena).observe(canvas);
addEventListener('resize',fitArena);
requestAnimationFrame(frame);
</script>
